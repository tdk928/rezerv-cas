spring:
  application:
    name: rezerv-cas
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:cas_db}
    username: ${DB_USERNAME:rezerv}
    password: ${DB_PASSWORD:rezerv}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

server:
  port: 8081

rezerv:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-0123456789abcdef0123456789abcdef}
    # TEMP: 1m за тест на logout при изтекъл token; после → 30m
    access-ttl: 1m
    refresh-ttl: 14d

management:
  endpoints:
    web:
      exposure:
        include: health,info
